name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    runs-on:  ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "0.13.8"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: uv sync and display dependency tree
        run: |
          uv sync --all-groups --extra all 
          uv tree
      - name: Lint
        run: |
          uv run ruff check
      - name: Check formatting
        run: |
          uv run ruff format --check
      - name: Test code
        run: |
          uv run --frozen pytest --cov=pvfit --cov-report=html:artifacts/test/htmlcov --junitxml=artifacts/test/junit-results.xml -vv tests
      - name: Test scripts
        continue-on-error: true
        run: |
          uv run pvfit-version
      - name: Archive results
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.python-version }}
          path: artifacts
        if: ${{ always() }}
      - name: Build pure-Python source and wheel disributions
        run: |
          uv build
      - name: Archive disributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.python-version }}
          path: dist
        if: ${{ always() }}
