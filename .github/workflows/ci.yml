name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    runs-on:  ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --progress-bar off --upgrade pip
          python -m pip --version
          python -m pip install --progress-bar off .[all]
          python -m pip list
      - name: Lint
        run: |
          python -m ruff check --extend-exclude tests
      - name: Check formatting
        run: |
          python -m ruff format --check
      - name: Test
        run: |
          python -m pytest --cov=pvfit --cov-report=html:artifacts/test/htmlcov --junitxml=artifacts/test/junit-results.xml -vv tests
      - name: Archive results
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.python-version }}
          path: artifacts
        if: ${{ always() }}
      - name: Build pure-Python source and wheel disributions
        run: |
          python -m build
      - name: Archive disributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.python-version }}
          path: dist
        if: ${{ always() }}
