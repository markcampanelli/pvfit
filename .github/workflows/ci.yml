name: build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    runs-on:  ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Generate lock
        run: |
          uv lock
          cat uv.lock
      - name: Lint
        run: |
          uv run ruff check --extend-exclude tests
      - name: Check formatting
        run: |
          uv run ruff format --check
      - name: Test code
        run: |
          uv run --frozen pytest --cov=pvfit --cov-report=html:artifacts/test/htmlcov --junitxml=artifacts/test/junit-results.xml -vv tests
      - name: Test scripts
        run: |
          uv run pvfit-version
      - name: Archive results
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.python-version }}
          path: artifacts
        if: ${{ always() }}
      - name: Build pure-Python source and wheel disributions
        run: |
          uv build
      - name: Archive disributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.python-version }}
          path: dist
        if: ${{ always() }}
